[project]
name = "tg-bridge"
version = "0.1.0"
description = "Read-only MCP bridge between a local LLM and a personal Telegram account"
requires-python = ">=3.12"
dependencies = [
    "telethon>=1.45,<2",
    "mcp>=2.3,<3",
    "python-dotenv>=1.0",
]

[project.scripts]
tg-bridge = "tg_bridge.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tg_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
